[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seq-viz"
version = "0.1.0"
description = "Real-time visualization system for transformer model token predictions during training"
readme = "README.md"
authors = [
    {name = "C-J-Cundy"},
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["machine learning", "transformers", "visualization", "training", "debugging"]

dependencies = [
    "torch>=2.0.0",
    "websockets>=10.0",
    "numpy>=1.21.0",
    "transformers>=4.30.0",
    "jsonschema>=3.2.0",
]

[project.optional-dependencies]
examples = [
    "trl>=0.7.0",
    "datasets>=2.0.0",
    "peft>=0.5.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.20.0",
    "requests",  # For downloading Shakespeare text
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "flake8>=4.0.0",
    "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/C-J-Cundy/seq-viz"
Repository = "https://github.com/C-J-Cundy/seq-viz"
Issues = "https://github.com/C-J-Cundy/seq-viz/issues"

[project.scripts]
seq-viz-server = "seq_viz.server.file_visualization_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seq_viz*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
seq_viz = [
    "core/training_data_schema.json",
    "web/*.html",
    "web/*.js",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true